ui:
  title: "BCN Status | Banua Cloud"
  header: "Banua Cloud"
  description: "Monitor status layanan Banua Cloud secara real-time"
  dashboard-heading: "Status Layanan"
  dashboard-subheading: "Monitor layanan Banua Cloud"
  logo: "/img/logo-bcn.png"
  link: "https://banuacloud.id"
  favicon:
    default: "/img/logo-bcn.png"
    size16x16: "/img/logo-bcn.png"
    size32x32: "/img/logo-bcn.png"
  default-sort-by: group
  dark-mode: false

storage:
  type: sqlite
  path: /opt/bcn_gatus/data/gatus.db
  maximum-number-of-results: 2000
  maximum-number-of-events: 500

endpoints:
  # Kominfo - Ping
  - name: Server Kominfo 01
    group: Kominfo (Ping)
    url: "icmp://157.15.123.19"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"

  - name: Server Kominfo 02
    group: Kominfo (Ping)
    url: "icmp://157.15.123.20"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"

  - name: Server Kominfo 03
    group: Kominfo (Ping)
    url: "icmp://157.15.123.21"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"

  - name: Server Kominfo 04
    group: Kominfo (Ping)
    url: "icmp://157.15.123.23"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"

  # Kominfo - Plesk
  - name: Server Kominfo 01 (Panel)
    group: Kominfo (Panel)
    url: "https://157.15.123.19:8443/"
    interval: 5m
    client:
      insecure: true
    conditions:
      - "[STATUS] < 500"

  - name: Server Kominfo 02 (Panel)
    group: Kominfo (Panel)
    url: "https://157.15.123.20:8443/"
    interval: 5m
    client:
      insecure: true
    conditions:
      - "[STATUS] < 500"

  - name: Server Kominfo 03 (Panel)
    group: Kominfo (Panel)
    url: "https://157.15.123.21:8443/"
    interval: 5m
    client:
      insecure: true
    conditions:
      - "[STATUS] < 500"

  - name: Server Kominfo 04 (Panel)
    group: Kominfo (Panel)
    url: "https://157.15.123.23:8443/"
    interval: 5m
    client:
      insecure: true
    conditions:
      - "[STATUS] < 500"

  # Banua Cloud Servers
  - name: Reverse Proxy BCN
    group: Banua Cloud
    url: "icmp://157.15.123.18"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"

  - name: ACS Banuacloud
    group: Banua Cloud
    url: "icmp://157.15.123.26"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"

  - name: Hosting Banuacloud
    group: Banua Cloud
    url: "icmp://157.15.123.24"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"

  - name: Pterodactyl
    group: Banua Cloud
    url: "icmp://157.15.123.25"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"
